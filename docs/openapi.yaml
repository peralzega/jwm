openapi: 3.1.0
info:
  title: JWM API
  version: 0.1.0
  description: |
    API JIEP Work Management. Autentikasi memakai cookie sesi `__Host-jwm_session`.
    Semua metode selain GET/HEAD/OPTIONS pada rute terautentikasi wajib
    menyertakan header `X-CSRF-Token` (lihat docs/adr/0001-sesi-dan-csrf.md).
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Masuk dengan email dan kata sandi
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string }
      responses:
        "200":
          description: Berhasil. Cookie sesi diset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401":
          description: Kredensial salah, akun nonaktif, atau terkunci (respons seragam).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Batas laju per IP terlampaui. Header Retry-After disertakan.
  /auth/me:
    get:
      summary: Pengguna saat ini dan token CSRF
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
          description: OK
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/me/preferensi:
    patch:
      summary: Ubah preferensi tampilan sendiri
      description: Hanya mengubah data milik pengguna yang meminta. Bidang yang tidak dikirim tidak berubah.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kepadatan: { type: string, enum: [compact, normal] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { description: Badan permintaan tidak valid atau berisi bidang tak dikenal }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Token CSRF tidak valid atau sandi wajib diganti (password_change_required) }
        "422": { description: Nilai kepadatan tidak dikenal (validation) }
  /auth/logout:
    post:
      summary: Keluar dan hapus sesi saat ini
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Berhasil }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Token CSRF tidak valid }
  /auth/password:
    post:
      summary: Ganti kata sandi sendiri
      description: Mencabut semua sesi pengguna, lalu membuat sesi baru untuk perangkat ini.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sandi_lama, sandi_baru]
              properties:
                sandi_lama: { type: string }
                sandi_baru: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200":
          description: Berhasil. Cookie sesi baru diset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Sandi lama salah atau token CSRF tidak valid }
        "422": { description: Sandi baru melanggar kebijakan }
        "429": { description: Batas laju per IP terlampaui }
  /users:
    get:
      summary: Cari pengguna aktif (untuk pemilih anggota)
      description: Terbuka bagi semua pengguna login. Minimal 2 karakter; maksimal 20 hasil.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
  /projects:
    description: |
      Hak efektif = irisan peran global dan peran proyek (SPEC bagian 2).
      Admin dan PMO mengelola semua proyek tanpa keanggotaan. Non-anggota
      mendapat 404 agar keberadaan proyek tidak bocor.
    get:
      summary: Proyek yang dapat dilihat pengguna
      parameters:
        - { name: arsip, in: query, description: true untuk proyek diarsipkan, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      summary: Buat proyek (Admin, PMO, Project Manager). Pembuat menjadi manager.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nama]
              properties:
                nama: { type: string, maxLength: 200 }
                mulai: { type: [string, "null"], format: date }
                selesai: { type: [string, "null"], format: date }
                prioritas: { $ref: "#/components/schemas/Priority" }
                pemilik_id:
                  type: string
                  format: uuid
                  description: Default pembuat. Harus pengguna aktif berperan PM, PMO, atau Admin; ditambahkan sebagai manager.
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Peran global tidak boleh membuat proyek }
        "422": { description: validation }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      summary: Detail proyek
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { description: Tidak ada atau tidak punya akses }
    patch:
      summary: Ubah proyek (manager efektif). Field tidak dikirim tidak berubah; null menghapus tanggal.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nama: { type: string }
                mulai: { type: [string, "null"], format: date }
                selesai: { type: [string, "null"], format: date }
                prioritas: { $ref: "#/components/schemas/Priority" }
                pemilik_id: { type: string, format: uuid, description: Harus anggota manager }
                portfolio_id: { type: [string, "null"], format: uuid, description: null melepas dari portofolio }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { description: Bukan manager efektif }
        "404": { description: Tidak ada atau tidak punya akses }
        "409": { description: project_archived }
        "422": { description: validation }
  /projects/{id}/status-manual:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    put:
      summary: Timpa status health proyek (Admin dan PMO), alasan wajib
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, alasan]
              properties:
                status: { $ref: "#/components/schemas/Health" }
                alasan: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "204": { description: Disimpan; tercatat di audit (timpa_status) }
        "403": { description: Bukan Admin atau PMO }
        "404": { description: not_found }
        "409": { description: project_archived }
        "422": { description: validation }
    delete:
      summary: Kembalikan status health ke perhitungan otomatis (Admin dan PMO)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dihapus; tercatat di audit (hapus_timpa_status) }
        "403": { description: Bukan Admin atau PMO }
        "409": { description: project_archived }
  /portfolios:
    get:
      summary: Daftar portofolio (semua pengguna login)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Portfolio" } }
    post:
      summary: Buat portofolio (Admin dan PMO)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nama]
              properties:
                nama: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
        "403": { description: Bukan Admin atau PMO }
        "409": { description: "portfolio_exists (nama sama, tanpa membedakan huruf besar/kecil)" }
        "422": { description: validation }
  /portfolios/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Ganti nama portofolio (Admin dan PMO)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nama]
              properties:
                nama: { type: string, maxLength: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
        "403": { description: Bukan Admin atau PMO }
        "404": { description: not_found }
        "409": { description: portfolio_exists }
    delete:
      summary: Hapus portofolio; proyeknya dilepas, tidak dihapus (Admin dan PMO)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dihapus }
        "403": { description: Bukan Admin atau PMO }
        "404": { description: not_found }
  /portfolio:
    get:
      summary: Dasbor portofolio (progres, prioritas, health) untuk proyek aktif yang dapat dilihat
      description: |
        Admin dan PMO melihat semua proyek aktif; pengguna lain proyek tempat ia
        menjadi anggota. Health dihitung saat diminta (docs/SPEC.md bagian 5 dan M5).
      parameters:
        - { name: prioritas, in: query, description: "Dipisah koma, mis. tinggi,kritis", schema: { type: string } }
        - { name: pemilik, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, description: "Health efektif, dipisah koma", schema: { type: string } }
        - { name: portofolio, in: query, description: 'UUID portofolio atau "tanpa"', schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioDashboard" }
        "400": { description: Filter tidak valid }
  /portfolio/projects/{id}/risks:
    get:
      summary: Item berisiko satu proyek beserta alasan per aturan (hak baca proyek)
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  items: { type: array, items: { $ref: "#/components/schemas/RiskItem" } }
        "404": { description: not_found }
  /projects/{id}/archive:
    post:
      summary: Arsipkan proyek (manager efektif). Proyek arsip hanya-baca.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}/unarchive:
    post:
      summary: Pulihkan proyek dari arsip (manager efektif)
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      summary: Anggota proyek (semua yang punya akses baca)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
    post:
      summary: Tambah anggota (manager efektif)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, peran_proyek]
              properties:
                user_id: { type: string, format: uuid }
                peran_proyek: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201":
          description: Ditambahkan; badan berisi daftar anggota terbaru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "409": { description: "already_member, project_archived" }
        "422": { description: "role_exceeds_global (Viewer global hanya viewer; Member global paling tinggi member), validation" }
  /projects/{id}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Ubah peran proyek anggota (manager efektif)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [peran_proyek]
              properties:
                peran_proyek: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200":
          description: OK; badan berisi daftar anggota terbaru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "404": { description: member_not_found }
        "409": { description: "owner_member (pemilik harus tetap manager), last_manager" }
        "422": { description: role_exceeds_global }
    delete:
      summary: Keluarkan anggota (manager efektif)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dikeluarkan }
        "404": { description: member_not_found }
        "409": { description: "owner_member, last_manager" }
  /projects/{id}/boards:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      summary: Board aktif pada proyek (akses baca)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Board" } }
    post:
      summary: Buat board (manager efektif)
      description: Board baru berisi grup "Tugas", kolom status berlabel bawaan, dan kolom person "Penanggung jawab".
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nama]
              properties:
                nama: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardDetail" }
  /boards/{id}:
    parameters: [{ $ref: "#/components/parameters/BoardID" }]
    get:
      summary: Board beserta kolom dan grup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardDetail" }
        "404": { description: Tidak ada, terhapus, atau tidak punya akses }
    patch:
      summary: Ubah nama atau urutan board (manager efektif)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nama: { type: string }
                urutan: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardDetail" }
    delete:
      summary: Hapus lunak board (manager efektif)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dihapus }
  /boards/{id}/columns:
    post:
      summary: Tambah kolom bertipe (manager efektif)
      parameters: [{ $ref: "#/components/parameters/BoardID" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tipe, judul]
              properties:
                tipe: { $ref: "#/components/schemas/ColumnType" }
                judul: { type: string, maxLength: 100 }
                konfigurasi:
                  type: object
                  description: |
                    status: {"labels":[{"id","judul","warna"}]} (kosong = label bawaan);
                    number: {"satuan"}; tipe lain tanpa konfigurasi.
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "422": { description: validation }
  /columns/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Ubah judul, urutan, atau konfigurasi kolom (tipe tidak dapat diubah)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                judul: { type: string }
                urutan: { type: number }
                konfigurasi: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "409": { description: label_in_use (label status masih dipakai item) }
    delete:
      summary: Hapus lunak kolom; nilai sel tetap tersimpan tetapi tidak ditampilkan
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dihapus }
  /boards/{id}/groups:
    post:
      summary: Tambah grup (manager efektif)
      parameters: [{ $ref: "#/components/parameters/BoardID" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [judul]
              properties:
                judul: { type: string, maxLength: 100 }
                warna: { $ref: "#/components/schemas/Color" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
  /groups/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Ubah judul, warna, atau urutan grup (manager efektif)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                judul: { type: string }
                warna: { $ref: "#/components/schemas/Color" }
                urutan: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
    delete:
      summary: Hapus lunak grup kosong (manager efektif)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dihapus }
        "409": { description: "group_not_empty, last_group" }
  /boards/{id}/items:
    parameters: [{ $ref: "#/components/parameters/BoardID" }]
    get:
      summary: Item aktif, paginasi kursor (urut id)
      description: Klien mengurutkan tampilan menurut urutan grup lalu urutan item.
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: kursor, in: query, description: Nilai kursor_berikut halaman sebelumnya, schema: { type: string, format: uuid } }
        - { name: batas, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  kursor_berikut:
                    type: [string, "null"]
                    format: uuid
                    description: Null bila tidak ada item lagi; halaman yang tepat penuh di akhir data juga bernilai null.
    post:
      summary: Buat item di akhir grup (member efektif ke atas)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_id, judul]
              properties:
                group_id: { type: string, format: uuid }
                judul: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
  /items/{id}:
    parameters: [{ $ref: "#/components/parameters/ItemID" }]
    description: |
      Hak ubah: manager untuk semua item; member hanya item yang ia buat atau yang
      menugaskannya di kolom person. Hak hapus: manager, atau member untuk item buatannya.
    get:
      summary: Detail item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
    patch:
      summary: Ubah judul item
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [judul]
              properties:
                judul: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "403": { description: Tidak berhak mengubah item ini }
    delete:
      summary: Hapus lunak item
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Dihapus }
        "403": { description: Tidak berhak menghapus item ini }
  /items/{id}/move:
    post:
      summary: Pindah item ke grup (di board yang sama), tepat setelah item acuan
      parameters: [{ $ref: "#/components/parameters/ItemID" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_id]
              properties:
                group_id: { type: string, format: uuid }
                setelah_item_id:
                  type: [string, "null"]
                  format: uuid
                  description: Kosong atau null = posisi paling atas grup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "422": { description: Grup atau item acuan tidak valid }
  /items/{id}/values/{columnId}:
    put:
      summary: Isi atau hapus (null) satu sel item
      parameters:
        - { $ref: "#/components/parameters/ItemID" }
        - { name: columnId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nilai]
              properties:
                nilai:
                  description: |
                    text: string (≤2000); status: id label; priority: rendah|sedang|tinggi|kritis;
                    person: array UUID anggota proyek (≤20); date: "YYYY-MM-DD";
                    timeline: {"mulai","selesai"}; number: angka; progress: bulat 0–100;
                    dependency: hanya-baca (lewat /boards/{id}/dependencies). null menghapus sel.
      description: |
        Mengubah kolom timeline utama (kolom timeline pertama board) menggeser
        successor yang melanggar FS secara berantai, maju saja, dengan durasi
        hari kerja tetap. Pelaku harus berhak mengubah setiap successor yang
        bergeser; bila tidak, seluruh perubahan ditolak (409 shift_forbidden,
        tanpa perubahan sebagian). Audit "geser_otomatis" mencatat pelaku asli
        dan item penyebab.
      responses:
        "200":
          description: OK. geser_otomatis berisi successor yang ikut bergeser (bila ada).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Item" }
                  - type: object
                    properties:
                      geser_otomatis:
                        type: array
                        items: { $ref: "#/components/schemas/ShiftedItem" }
        "409": { description: "shift_forbidden (pesan menyebut successor yang tidak boleh diubah), project_archived" }
        "422": { description: "validation, read_only_column" }
  /boards/{id}/dependencies:
    parameters:
      - { $ref: "#/components/parameters/BoardID" }
    get:
      summary: Daftar dependensi board (kedua item masih aktif)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Dependency" } }
    post:
      summary: Tambah dependensi FS antara dua item di board yang sama
      description: |
        Pelaku harus berhak mengubah kedua item. Ditolak bila antar-board, ke
        diri sendiri, ganda (pasangan predecessor-successor unik), atau membentuk
        siklus. Lag dalam hari kerja; lag negatif (lead) diizinkan. Membuat
        dependensi tidak menggeser jadwal; pelanggaran FS dilaporkan /schedule.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [predecessor_id, successor_id]
              properties:
                predecessor_id: { type: string, format: uuid }
                successor_id: { type: string, format: uuid }
                tipe: { type: string, enum: [FS], default: FS }
                lag_hari: { type: integer, minimum: -365, maximum: 365, default: 0 }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dependency" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "board atau item tidak ditemukan / bukan anggota" }
        "409": { description: "dependency_exists, project_archived" }
        "422": { description: "dependency_cycle (pesan menyebut kedua item), validation (diri sendiri, antar-board, tipe, lag)" }
  /dependencies/{id}:
    delete:
      summary: Hapus dependensi (pelaku harus berhak mengubah kedua item)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Dihapus }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: not_found }
  /boards/{id}/schedule:
    get:
      summary: Jalur kritis (CPM) board pada satu kolom timeline
      description: |
        Dihitung saat diminta dari jadwal, dependensi FS, dan kalender kerja
        (Senin–Jumat, ditimpa work_calendar). Aturan item tanpa jadwal dan item
        induk: docs/SPEC.md M4.
      parameters:
        - { $ref: "#/components/parameters/BoardID" }
        - name: timeline
          in: query
          description: ID kolom timeline; bawaan kolom timeline pertama (utama).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleView" }
        "400": { description: "parameter timeline bukan UUID" }
        "404": { description: not_found }
        "422": { description: "no_timeline, validation (bukan kolom timeline board ini, rentang terlalu lebar), dependency_cycle (data lama)" }
  /work-calendar:
    get:
      summary: Isi kalender kerja satu tahun (semua pengguna login)
      parameters:
        - name: tahun
          in: query
          description: Bawaan tahun berjalan (waktu server).
          schema: { type: integer, minimum: 1900, maximum: 2999 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tahun: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/CalendarDay" } }
                  tahun_terisi: { type: array, items: { type: integer }, description: Tahun yang punya minimal satu baris }
        "422": { description: validation }
  /admin/work-calendar/{tanggal}:
    parameters:
      - { name: tanggal, in: path, required: true, schema: { type: string, format: date } }
    put:
      summary: Tambah atau ubah satu tanggal (Admin)
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                hari_kerja: { type: boolean, default: false, description: "false = libur; true = akhir pekan yang dijadikan hari kerja" }
                keterangan: { type: string, maxLength: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: validation }
    delete:
      summary: Hapus satu tanggal, kembali ke pola Senin–Jumat (Admin)
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Dihapus }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: not_found }
  /admin/work-calendar/import:
    post:
      summary: Impor kalender kerja dari CSV (Admin), semua atau tidak sama sekali
      description: |
        Baris pertama header: tanggal (YYYY-MM-DD, wajib), keterangan, hari_kerja
        (ya/tidak; kosong = libur), urutan bebas. Pemisah koma atau titik koma;
        BOM UTF-8 diabaikan. Maksimal 3.000 baris. Semua galat dilaporkan dengan
        nomor baris dan tidak ada yang disimpan. ganti = true menghapus dulu
        semua tanggal pada tahun-tahun yang ada di berkas.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csv]
              properties:
                csv: { type: string, description: "Isi berkas CSV (UTF-8); badan JSON maksimal 1 MB" }
                ganti: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jumlah: { type: integer }
                  tahun: { type: array, items: { type: integer } }
                  dihapus: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "invalid_csv (pesan berisi nomor baris)" }
  /admin/users:
    description: |
      Semua rute /admin hanya untuk peran Admin dan dapat dibatasi per jaringan
      lewat ADMIN_ALLOWED_CIDRS (403 forbidden_network).
    get:
      summary: Daftar pengguna
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: peran, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - { name: aktif, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Buat akun. Peran default viewer. Sandi sementara dikembalikan sekali.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nama, email]
              properties:
                nama: { type: string, maxLength: 200 }
                email: { type: string }
                peran: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithTempPassword" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: email_taken }
        "422": { description: validation }
  /admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/UserID" }]
    get:
      summary: Detail pengguna
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { description: not_found }
    patch:
      summary: Ubah nama, email, atau peran
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nama: { type: string }
                email: { type: string }
                peran: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "409": { description: "email_taken, atau last_admin (Admin aktif terakhir tidak dapat diturunkan)" }
        "422": { description: validation }
  /admin/users/{id}/deactivate:
    post:
      summary: Nonaktifkan akun dan cabut semua sesinya
      parameters: [{ $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "409": { description: "last_admin, atau self_action (tidak dapat menonaktifkan diri sendiri)" }
  /admin/users/{id}/activate:
    post:
      summary: Aktifkan kembali akun
      parameters: [{ $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{id}/reset-password:
    post:
      summary: Buat sandi sementara baru, buka kunci, cabut semua sesi
      parameters: [{ $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: OK. Sandi sementara dikembalikan sekali.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithTempPassword" }
        "409": { description: self_action (Admin memakai /auth/password untuk dirinya) }
  /admin/users/{id}/unlock:
    post:
      summary: Buka kunci login dan reset hitungan gagal
      parameters: [{ $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/audit-log:
    get:
      summary: Audit log, terbaru lebih dulu, paginasi kursor
      parameters:
        - { name: entitas, in: query, schema: { type: string } }
        - { name: entitas_id, in: query, schema: { type: string } }
        - { name: aktor_id, in: query, schema: { type: string, format: uuid } }
        - { name: kursor, in: query, description: Nilai kursor_berikut dari halaman sebelumnya, schema: { type: integer } }
        - { name: batas, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  kursor_berikut: { type: [integer, "null"] }
components:
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    ProjectID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoardID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Forbidden:
      description: Bukan Admin (forbidden) atau di luar jaringan yang diizinkan (forbidden_network)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Sesi tidak ada atau kedaluwarsa
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Kode galat, mis. invalid_credentials, unauthenticated, csrf, password_change_required
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        email: { type: string }
        peran: { type: string, enum: [admin, pmo, project_manager, member, viewer] }
        wajib_ganti_sandi:
          type: boolean
          description: Bila true, semua rute selain /auth/me, /auth/password, dan /auth/logout menjawab 403 password_change_required.
        kepadatan:
          type: string
          enum: [compact, normal]
          description: Kepadatan tampilan pilihan pengguna. Default compact.
    Role:
      type: string
      enum: [admin, pmo, project_manager, member, viewer]
    Priority:
      type: string
      enum: [rendah, sedang, tinggi, kritis]
      default: sedang
    ProjectRole:
      type: string
      enum: [manager, member, viewer]
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        pemilik_id: { type: string, format: uuid }
        pemilik_nama: { type: string }
        mulai: { type: [string, "null"], format: date }
        selesai: { type: [string, "null"], format: date }
        prioritas: { $ref: "#/components/schemas/Priority" }
        dibuat_pada: { type: string, format: date-time }
        diubah_pada: { type: string, format: date-time }
        diarsipkan_pada: { type: [string, "null"], format: date-time }
        portfolio_id: { type: [string, "null"], format: uuid }
        portfolio_nama: { type: [string, "null"], description: Hanya pada GET /projects/{id} }
        peran_saya:
          $ref: "#/components/schemas/ProjectRole"
          description: Hak efektif pengguna yang meminta
    Health:
      type: string
      enum: [hijau, kuning, merah]
    RiskRule:
      type: string
      enum: [lewat_tenggat, tenggat_dekat, tanpa_penanggung_jawab, predecessor_terlambat, melewati_tenggat_proyek]
    Portfolio:
      type: object
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        jumlah_proyek: { type: integer, description: Proyek aktif di portofolio ini }
        dibuat_pada: { type: string, format: date-time }
        diubah_pada: { type: string, format: date-time }
    ProjectHealth:
      type: object
      properties:
        id: { type: string, format: uuid }
        nama: { type: string }
        pemilik_id: { type: string, format: uuid }
        pemilik_nama: { type: string }
        prioritas: { $ref: "#/components/schemas/Priority" }
        mulai: { type: [string, "null"], format: date }
        selesai: { type: [string, "null"], format: date }
        portfolio_id: { type: [string, "null"], format: uuid }
        portfolio_nama: { type: [string, "null"] }
        progres: { type: [number, "null"], description: "Rata-rata tertimbang durasi hari kerja; null bila tanpa item" }
        progres_rencana: { type: [number, "null"], description: Hanya item berjadwal }
        progres_jadwal: { type: [number, "null"], description: Progres aktual pada item berjadwal (pembanding rencana) }
        jumlah_item: { type: integer }
        item_berisiko: { type: integer }
        per_aturan: { type: object, additionalProperties: { type: integer }, description: Kunci RiskRule }
        kritis_terlambat: { type: integer }
        health: { $ref: "#/components/schemas/Health", description: Efektif (manual bila ada) }
        health_otomatis: { $ref: "#/components/schemas/Health" }
        health_alasan: { type: array, items: { type: string } }
        status_manual:
          type: [object, "null"]
          properties:
            status: { $ref: "#/components/schemas/Health" }
            alasan: { type: string }
            oleh_nama: { type: string }
            pada: { type: string, format: date-time }
        peringatan: { type: array, items: { type: string } }
    PortfolioDashboard:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProjectHealth" } }
        ambang:
          type: object
          properties:
            tenggat_dekat_hari: { type: integer }
            tenggat_dekat_progres: { type: integer }
            kuning_persen: { type: integer }
            merah_persen: { type: integer }
            tertinggal_poin: { type: integer }
        hari_ini: { type: string, format: date }
    RiskItem:
      type: object
      properties:
        item_id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        board_nama: { type: string }
        judul: { type: string }
        kritis: { type: boolean }
        alasan:
          type: array
          items:
            type: object
            properties:
              kode: { $ref: "#/components/schemas/RiskRule" }
              pesan: { type: string }
    ColumnType:
      type: string
      enum: [text, status, person, date, timeline, number, progress, priority, dependency]
    Color:
      type: string
      enum: [abu, biru, hijau, kuning, oranye, merah, ungu, tosca, merah_muda]
    Board:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        nama: { type: string }
        urutan: { type: number }
    Column:
      type: object
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        tipe: { $ref: "#/components/schemas/ColumnType" }
        judul: { type: string }
        urutan: { type: number }
        konfigurasi: { type: object }
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        judul: { type: string }
        warna: { $ref: "#/components/schemas/Color" }
        urutan: { type: number }
    BoardDetail:
      allOf:
        - { $ref: "#/components/schemas/Board" }
        - type: object
          properties:
            kolom: { type: array, items: { $ref: "#/components/schemas/Column" } }
            grup: { type: array, items: { $ref: "#/components/schemas/Group" } }
            peran_saya: { $ref: "#/components/schemas/ProjectRole" }
    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        judul: { type: string }
        urutan: { type: number }
        dibuat_oleh: { type: string, format: uuid }
        dibuat_pada: { type: string, format: date-time }
        diubah_pada: { type: string, format: date-time }
        nilai:
          type: object
          description: Peta column_id ke nilai sel (kolom terhapus tidak ditampilkan)
          additionalProperties: true
        bisa_ubah: { type: boolean, description: Hak pengguna yang meminta untuk mengubah item ini }
        bisa_hapus: { type: boolean }
    Dependency:
      type: object
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        predecessor_id: { type: string, format: uuid }
        successor_id: { type: string, format: uuid }
        tipe: { type: string, enum: [FS] }
        lag_hari: { type: integer, description: Lag dalam hari kerja }
    ShiftedItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        judul: { type: string }
        mulai: { type: string, format: date }
        selesai: { type: string, format: date }
        predecessor_id: { type: string, format: uuid, description: Predecessor langsung yang memaksa pergeseran }
    ItemSchedule:
      type: object
      description: Tanggal YYYY-MM-DD; es sampai slack null untuk item tanpa jadwal yang tidak dapat dihitung.
      properties:
        item_id: { type: string, format: uuid }
        es: { type: string, format: date, nullable: true }
        ef: { type: string, format: date, nullable: true }
        ls: { type: string, format: date, nullable: true }
        lf: { type: string, format: date, nullable: true }
        slack: { type: integer, nullable: true, description: Hari kerja }
        kritis: { type: boolean, description: "slack = 0" }
        melanggar_fs: { type: boolean, description: Dijadwalkan mulai sebelum predecessor selesai (dengan lag) }
        tanpa_jadwal: { type: boolean }
    ScheduleView:
      type: object
      properties:
        kolom_id: { type: string, format: uuid }
        kolom_utama: { type: boolean, description: Pergeseran otomatis hanya berlaku pada kolom utama }
        selesai_proyek: { type: string, format: date, nullable: true }
        items: { type: array, items: { $ref: "#/components/schemas/ItemSchedule" } }
        dependensi_dilanggar: { type: array, items: { type: string, format: uuid } }
        peringatan:
          type: array
          items:
            type: object
            properties:
              kode: { type: string, enum: [kalender_kosong] }
              tahun: { type: integer }
              pesan: { type: string }
    CalendarDay:
      type: object
      properties:
        tanggal: { type: string, format: date }
        hari_kerja: { type: boolean }
        keterangan: { type: string }
    MemberList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              nama: { type: string }
              email: { type: string }
              peran_global: { $ref: "#/components/schemas/Role" }
              aktif: { type: boolean }
              peran_proyek: { $ref: "#/components/schemas/ProjectRole" }
              peran_efektif:
                type: string
                enum: [manager, member, viewer, ""]
                description: Irisan peran global dan peran proyek; kosong bila akun nonaktif
